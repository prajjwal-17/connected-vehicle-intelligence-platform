apiVersion: apps/v1
kind: Deployment
metadata:
  name: "{{ include \"fleetpulse.fullname\" . }}-web"
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: "{{ include \"fleetpulse.fullname\" . }}-web"
  template:
    metadata:
      labels:
        app: "{{ include \"fleetpulse.fullname\" . }}-web"
    spec:
      containers:
        - name: web
          image: {{ .Values.web.image | quote }}
          ports:
            - containerPort: {{ .Values.web.port }}
          readinessProbe:
            httpGet: { path: /, port: {{ .Values.web.port }} }
            initialDelaySeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: "{{ include \"fleetpulse.fullname\" . }}-web"
spec:
  selector:
    app: "{{ include \"fleetpulse.fullname\" . }}-web"
  ports:
    - port: {{ .Values.service.webPort }}
      targetPort: {{ .Values.web.port }}
